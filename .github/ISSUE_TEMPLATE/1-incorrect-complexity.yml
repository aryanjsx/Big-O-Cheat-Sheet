name: Incorrect complexity or explanation
description: A bound, assumption, code comment, or explanation on the site looks wrong.
title: "Complexity: "
labels: ["accuracy"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page with the claim.
      placeholder: https://aryanjsx.github.io/BigOSheet/topics/dijkstra/
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What the site says
      description: Quote the claim exactly, including which case it is (best, average, amortized, worst) and any assumption shown.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What it should say
      description: The correct bound and the assumptions it depends on, such as the implementation or input.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A textbook section, paper, official documentation, or a short derivation. Claims without a source are hard to verify.
    validations:
      required: true
