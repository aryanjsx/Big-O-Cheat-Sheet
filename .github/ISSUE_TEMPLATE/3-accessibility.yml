name: Accessibility or layout issue
description: Something is hard to use with a keyboard, screen reader, zoom, or on a small screen.
title: "Accessibility: "
labels: ["accessibility"]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the visualizer on a phone.
        2. Choose Quicksort.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser, device, and assistive technology
      description: For example, Firefox 132 on Windows 11 with NVDA, or Safari on iPhone at 200% text size.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Optional, but helpful for layout problems.
