name: Broken link or wrong reference
description: A link goes nowhere, or a reference does not support the claim next to it.
title: "Link: "
labels: ["links"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page with the link.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: The link
      description: The link text or URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: For example, a 404, the wrong section, or a reference that says something different.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Suggested replacement
      description: A working or better link, if you have one.
