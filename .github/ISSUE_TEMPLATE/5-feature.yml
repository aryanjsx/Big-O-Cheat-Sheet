name: Feature request
description: Suggest a topic, tool, or improvement.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: Describe the study or interview-prep problem, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources for any new complexity claims
      description: New topics need a reference for every non-obvious bound.
